        <h2>Envie uma mensagem</h2>
        

        <form action="https://formsubmit.co/gabriel.brandao.pj@gmail.com" method="POST" class="formulario-contato">
            
         
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="Nova mensagem do Portfólio!">

            <div class="campo-form">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="campo-form">
                <label for="email">E-mail para retorno:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="campo-form">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Como posso te ajudar?" required></textarea>
            </div>

            <button type="submit" class="btn-enviar">Enviar Mensagem</button>
        </form>
